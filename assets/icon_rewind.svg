<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Sata Rewindのアイコン">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A93D8"/>
      <stop offset="1" stop-color="#35E0C4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DCEEFA" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="blur14" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- 背景: 層グラデ -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- 発光ハロー -->
  <circle cx="200" cy="185" r="150" fill="url(#halo)" filter="url(#blur14)"/>

  <!-- 逆回転の矢印(反時計回り) -->
  <g stroke="#FFFFFF" stroke-width="17" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 305 232 A 112 112 0 1 1 258 96" transform="rotate(-8 200 190)"/>
  </g>
  <path d="M 262 62 L 236 112 L 292 116 Z" fill="#FFFFFF" transform="rotate(-8 200 190)"/>

  <!-- 時計キャラ(ガラス質感) -->
  <g transform="rotate(-6 200 195)">
    <circle cx="200" cy="195" r="86" fill="url(#glass)" stroke="#FFFFFF" stroke-width="5"/>
    <!-- グロッシー・ハイライト -->
    <ellipse cx="172" cy="158" rx="46" ry="26" fill="#FFFFFF" opacity="0.65"/>
    <!-- 文字盤の目盛り -->
    <g stroke="#3A93D8" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <line x1="200" y1="118" x2="200" y2="130"/>
      <line x1="277" y1="195" x2="265" y2="195"/>
      <line x1="200" y1="272" x2="200" y2="260"/>
      <line x1="123" y1="195" x2="135" y2="195"/>
    </g>
    <!-- 逆走する針(反時計回りに傾ける) -->
    <g stroke="#1B2A3A" stroke-width="9" stroke-linecap="round">
      <line x1="200" y1="200" x2="163" y2="172"/>
      <line x1="200" y1="200" x2="222" y2="152"/>
    </g>
    <circle cx="200" cy="199" r="9" fill="#1B2A3A"/>
    <!-- 顔: 点目+弧の口+ピーチ頬 -->
    <circle cx="172" cy="224" r="6.5" fill="#1B2A3A"/>
    <circle cx="228" cy="224" r="6.5" fill="#1B2A3A"/>
    <circle cx="170" cy="222" r="2" fill="#FFFFFF"/>
    <circle cx="226" cy="222" r="2" fill="#FFFFFF"/>
    <path d="M 188 238 Q 200 248 212 238" stroke="#1B2A3A" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="152" cy="238" r="9" fill="#FFB27A" opacity="0.7"/>
    <circle cx="248" cy="238" r="9" fill="#FFB27A" opacity="0.7"/>
  </g>

  <!-- 静と動の火花: 四点スター -->
  <path d="M 322 84 l 7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 78 300 l 5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 Z" fill="#FFB27A" opacity="0.9"/>
</svg>
